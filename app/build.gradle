apply plugin: 'com.android.application'

// Release signing: env vars (CI) or local keystore.properties (gitignored).
// Without credentials, release builds unsigned so plain CI still passes.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseStoreFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
        ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
        ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
        ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
        ?: keystoreProperties['keyPassword']

def releaseKeystoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
def hasReleaseSigning = releaseKeystoreFile != null \
        && releaseKeystoreFile.exists() \
        && releaseStorePassword \
        && releaseKeyAlias \
        && releaseKeyPassword

android {
    defaultConfig {
        applicationId "ch.logixisland.anuto"
        compileSdk 35
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 38
        versionName "0.13.4"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation'
    }
    namespace 'ch.logixisland.anuto'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
