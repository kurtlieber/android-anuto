apply plugin: 'com.android.application'

android {
    defaultConfig {
        applicationId "ch.logixisland.anuto"
        compileSdk 35
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 35
        versionName "0.13.1"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Sign release with the debug keystore when present (local Obtainium builds).
    // GitHub Actions runners usually lack this file; release then builds unsigned so CI still passes.
    signingConfigs {
        release {
            def debugKeystore = file("${System.properties['user.home']}/.android/debug.keystore")
            if (debugKeystore.exists()) {
                storeFile debugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def debugKeystore = file("${System.properties['user.home']}/.android/debug.keystore")
            if (debugKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation'
    }
    namespace 'ch.logixisland.anuto'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
